<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RidGame</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#4b8f29, #1e4d18);
      position: relative;
      overflow: hidden;
    }

    #top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }

    .box {
      background: rgba(0,0,0,.65);
      padding: 10px 14px;
      border-radius: 10px;
    }

    #player {
      width: 45px;
      height: 45px;
      background: #2196f3;
      border: 3px solid white;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .enemy {
      width: 40px;
      height: 40px;
      background: #e53935;
      border: 3px solid white;
      border-radius: 50%;
      position: absolute;
    }

    #controls {
      position: absolute;
      bottom: 25px;
      left: 20px;
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px;
      gap: 5px;
      z-index: 20;
    }

    button {
      border: none;
      border-radius: 12px;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

    button:active {
      background: #2196f3;
    }

    #shoot {
      position: absolute;
      right: 25px;
      bottom: 45px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #d32f2f;
      z-index: 20;
    }

    #startScreen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #startScreen h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    #startScreen p {
      margin-bottom: 25px;
    }

    #start {
      padding: 15px 35px;
      background: #2196f3;
      font-size: 20px;
    }
  </style>
</head>

<body>

<div id="game">

  <div id="top">
    <div class="box">❤️ HP: <span id="hp">100</span></div>
    <div class="box">🎯 Score: <span id="score">0</span></div>
  </div>

  <div id="player"></div>

  <div id="controls">
    <div></div>
    <button id="up">▲</button>
    <div></div>

    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶
