<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RidGame</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#263b27}
#menu,#gameover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#071018dd,#101820f5);color:white;z-index:10;text-align:center}
#gameover{display:none}
h1{font-size:52px;margin:0 0 8px}
p{font-size:18px}
button{border:0;border-radius:12px;padding:16px 35px;font-size:20px;font-weight:bold;background:#e7b52f;color:#111}
#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;color:white;font-weight:bold;font-size:17px;z-index:3}
.bar{width:140px;height:14px;background:#222;border:1px solid #fff;border-radius:8px;overflow:hidden}
#health{height:100%;background:#39d353;width:100%}
#controls{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
#joy{position:absolute;left:25px;bottom:25px;width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff18;pointer-events:auto}
#stick{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:#ffffff66}
#fire{position:absolute;right:28px;bottom:35px;width:90px;height:90px;border-radius:50%;background:#d33b35cc;color:#fff;font-size:18px;pointer-events:auto}
#reload{position:absolute;right:135px;bottom:35px;width:75px;height:55px;padding:5px;font-size:14px;pointer-events:auto}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);z-index:2;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{width:22px;height:2px;top:10px}
#cross:after{width:2px;height:22px;left:10px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
<h1>RIDGAME</h1>
<p>Battle • Shoot • Survive</p>
<button id="start">START GAME</button>
</div>

<div id="gameover">
<h1>GAME OVER</h1>
<p id="final"></p>
<button id="again">PLAY AGAIN</button>
</div>

<div id="hud">
<div>
<div>HP</div>
<div class="bar"><div id="health"></div></div>
</div>
<div id="ammo">AMMO: 30 / 120</div>
<div id="kills">KILLS: 0</div>
</div>

<div id="cross"></div>

<div id="controls">
<div id="joy"><div id="stick"></div></div>
<button id="reload">RELOAD</button>
<button id="fire">FIRE</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,dpr;

 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const menu=document.getElementById("menu");
const over=document.getElementById("gameover");
const controls=document.getElementById("controls");
const hud=document.getElementById("hud");
const healthBar=document.getElementById("health");
const ammoText=document.getElementById("ammo");
const killsText=document.getElementById("kills");
const finalText=document.getElementById("final");

let keys={};

const player={

function reset(){

 player.x=world.w/2;player.y=world.h/2;player.hp=100;
 bullets=[];enemies=[];particles=[];loot=[];
 walls=[];
 for(let i=0;i<35;i++){
  let x=150+Math.random()*(world.w-300);
  let y=150+Math.random()*(world.h-300);
  if(Math.hypot(x-player.x,y-player.y)<300){i--;continue}
  walls.push({x,y,w:80+Math.random()*150,h:50+Math.random()*100});
 }
 for(let i=0;i<7;i++)spawnEnemy();
}

function spawnEnemy(){
 let a=Math.random()*Math.PI*2;
 let d=600+Math.random()*700;
 let x=player.x+Math.cos(a)*d,y=player.y+Math.sin(a)*d;
 x=Math.max(50,Math.min(world.w-50,x));
 y=Math.max(50,Math.min(world.h-50,y));
 enemies.push({
  x,y,r:21,hp:60,maxHp:60,
  speed:75+Math.random()*35,
  cooldown:Math.random(),
  angle:0
 });
}

function circleRect(c,r){
 return c.x+r>r.x&&c.x-r<r.x+r.w&&c.y+r>r.y&&c.y-r<r.y+r.h;
}
function blocked(x,y,r){
 if(x-r<0||y-r<0||x+r>world.w||y+r>world.h)return true;
 for(const w of walls){
  if(circleRect({x,y},r,w))return true;
 }
 return false;
}
function moveEntity(o,dx,dy){
 if(!blocked(o.x+dx,o.y,o.r))o.x+=dx;
 if(!blocked(o.x,o.y+dy,o.r))o.y+=dy;
}
